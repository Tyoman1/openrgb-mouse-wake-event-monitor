name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # v4.4.0 — https://github.com/actions/checkout/releases/tag/v4.4.0

      - name: Configure
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $cmake = "$vsPath\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe"
          & $cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $cmake = "$vsPath\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe"
          & $cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Verify
        shell: pwsh
        run: |
          $exe = "build/Release/WakeEventMonitor.exe"
          if (-not (Test-Path $exe)) { Write-Host "::error::EXE not found"; exit 1 }
          $size = (Get-Item $exe).Length
          $hash = Get-FileHash $exe -Algorithm SHA256
          "$($hash.Hash)  WakeEventMonitor.exe" | Out-File build/Release/WakeEventMonitor.sha256.txt -Encoding ascii
          Write-Host "Size: $size bytes"
          Write-Host "SHA256: $($hash.Hash)"

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        # v4.6.2 — https://github.com/actions/upload-artifact/releases/tag/v4.6.2
        with:
          name: WakeEventMonitor
          path: |
            build/Release/WakeEventMonitor.exe
            build/Release/WakeEventMonitor.sha256.txt